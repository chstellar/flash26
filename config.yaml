# main files
data_table: dataset_table.csv
temp_dir: /scratch/users/dcotter1/metaSPLASH_workflows
splash_bin: /oak/stanford/groups/horence/dcotter1/splash-2.11.1/

# annotation lookup table
lookup_table_for_annotation: /oak/stanford/groups/horence/dcotter1/lookup_tables/microbial_lookup/microbial_v2_lookup.slt

# path to directory with genomes
genomes_dir: /scratch/groups/horence/dcotter1/data/Hyun_etAl_2023_AMR_genomes

# set paths to python venvs
envs:
  default_python: /oak/stanford/groups/horence/dcotter1/envs/biopython/bin/activate
  esm_env: /oak/stanford/groups/horence/dcotter1/envs/esm_venv/bin/activate
  adelie: /oak/stanford/groups/horence/dcotter1/envs/adelie_venv/bin/activate

# define all scripts
scripts:
  anchor_select_script: 
    filter1: src/anchor_selection/select_anchors_filter1.R # arrange by nonzero samples then head
    filter2: src/anchor_selection/select_anchors_filter2.R # arrange by effect size then head
    filter3: src/anchor_selection/select_anchors_filter3.R # arrange by effect size * nonzero samples then head (see README for details)
    filter4: src/anchor_selection/select_anchors_filter4.R # only care about effect size (DO NOT lookup filter)
    filter5: src/anchor_selection/select_anchors_filter5.R # filter EXACTLY as in previous 
  cluster_script: 
    shiftDist-keepTopES: 'python src/clustering/deduplication_clustering.py'
    shiftDist-keepMostAbundant: 'python src/clustering/deduplication_clustering.py'
    shiftDist-levFilter: 'python src/clustering/deduplication_clustering.py'
    shiftDist-hamFilter: 'python src/clustering/deduplication_clustering.py'
    mmseqs-levFilter: 'Rscript --vanilla src/clustering/cluster_with_mmseq.R'
    translated-clusters-levFilter: 'python src/clustering/translate_and_cluster.py'
    oldClusters: 'python src/clustering/deduplication_clustering.py'
  reorder_script:
    shiftDist-keepTopES: src/clustering/keep_topES_anchor_per_cluster.R
    shiftDist-keepMostAbundant: src/clustering/keep_mostAbundant_anchor_per_cluster.R
    shiftDist-levFilter: "src/clustering/filter_clusters_by_distance.R --distance_metric lev"
    shiftDist-hamFilter: "src/clustering/filter_clusters_by_distance.R --distance_metric ham"
    mmseqs-levFilter: src/clustering/filter_clusters_by_distance.R
    translated-clusters-levFilter: src/clustering/filter_clusters_by_distance.R
    oldClusters: src/clustering/clusters_noReorder.R
  match_kmers_to_clusters: src/process_seqs/id_kmers_per_cluster.R
  prepare_sequences: src/process_seqs/process_splash_data_for_embedding.R
  decompose_kmers: src/process_seqs/kmer_decomposition.py
  translate_script: src/process_seqs/translate_fasta.py
  extract_embeddings: src/esm_utils/extract_embeddings_from_torch_objects.py
  embed_kmers_hyena: src/hyena_utils/embed_fasta.sh
  embed_kmers_hyena_marlowe_nov2024: src/hyena_utils/embed_fasta_marlowe_model.sh
  format_embeddings_variance: src/glmnet/grab_top_embeddings_by_variance.R
  format_sequences_ohe: src/process_seqs/one_hot_encode_anchor_clusters.R
  glmnet_script: src/glmnet/embeddings_glmnet.R
  adelie: src/glmnet/run_adelie.py
  rand_forests_script: src/glmnet/random_forests_embeddings.R
  genome_to_sample_sequences: src/process_genomes/sample_sequences_from_genomes.R
  format_embeddings_genomes: src/process_genomes/grab_overlapping_features.R
  glmnet_genomes_script: src/glmnet/train_and_test_glmnet.R
  annotate_clusters: src/annotation/annotate_with_lookup_table.py
  merge_annotations: src/annotation/merge_coefs_with_annotations.R
  run_blast: src/annotation/blast_code/run_blast.sh