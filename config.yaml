# main files
data_table: dataset_table.csv
temp_dir: /scratch/users/dcotter1/test_FLASH-smk_mab_jan2026/
splash_bin: /oak/stanford/groups/horence/dcotter1/splash-2.11.1/

# annotation lookup table
lookup_table_for_annotation: resources/lookup_tables/amr_split.slt
lookup_table_for_arifact_filtering: resources/lookup_tables/mini_artifact_lookup.slt

# entrez email
entrez_email: "" # YOUR_EMAIL

# blast database path (if using local databases)
blast_db_path: "" # provide with path to local blast databases if available

# path to directory with genomes
genomes_dir: "" # provide with path to genomes downloaded from 

# set paths to conda env definitions
envs:
  default_r: envs/default-R.yaml
  biopython_env: envs/biopython_env.yaml
  biopython_env_r: envs/biopython_env_r.yaml
  adelie_env: envs/adelie_env.yaml
  
containers:
  hyena_embedder: containers/hyena_embedder.sif

# define all scripts and parameters used in the pipeline
scripts:
  anchor_select_script: 
    filter1: src/anchor_selection/select_anchors_filter1.R # arrange by nonzero samples then head
  cluster_script: 
    shiftDist-levFilter: 'python src/clustering/shiftDist_clustering.py'
    masked-aa-clustered: 'python src/clustering/fuzzy_lookup_clustering_AA.py'
    masked-nucleotide-clustered: 'python src/clustering/fuzzy_lookup_clustering.py'
    noCluster: 'python src/clustering/noClustering.py' # used for short anchors
  clustering_params:
    fuzzy_nt_clustering_params: "--m 5 --N 1000 --j 5"
    fuzzy_aa_clustering_params: "--m 3 --N 300 --j 2"
  reorder_script:
    shiftDist-levFilter: "src/clustering/filter_clusters_by_distance.R --distance_metric lev"
    masked-aa-clustered: "src/clustering/filter_clusters_by_distance.R --distance_metric lev"
    masked-nucleotide-clustered: "src/clustering/filter_clusters_by_distance.R --distance_metric lev"
    noCluster: "src/clustering/filter_clusters_by_distance.R --distance_metric noCluster" # used for short anchors
  reorder_parameters:
    distance_threshold: 5 # this is the distance threshold for filtering anchors
  match_kmers_to_clusters: src/process_seqs/id_kmers_per_cluster.R
  prepare_sequences: src/process_seqs/process_fastqs_for_embedding_and_ohe.R
  prepare_sequences_single_cell: src/process_seqs/process_splash_data_for_embedding.R
  decompose_kmers: src/process_seqs/kmer_decomposition.py
  translate_script: src/process_seqs/translate_kmers_by_cluster.R
  extract_embeddings: src/esm_utils/extract_embeddings_from_torch_objects.py
  embed_kmers_hyena: src/hyena_utils/embed_fasta_H100.sh
  hyena_kmer_embedder: src/hyena_utils/dev_embedder.py
  format_embeddings_variance: src/glmnet/grab_top_embeddings_by_variance.R
  format_sequences_ohe: src/process_seqs/one_hot_encode_anchor_clusters.R
  adelie: src/glmnet/run_adelie.py
  genome_to_sample_sequences: src/process_genomes/sample_sequences_from_genomes.R
  format_embeddings_genomes: src/process_genomes/grab_overlapping_features.R
  glmnet_genomes_script: src/glmnet/run_adelie_genomes.py
  annotate_clusters: src/annotation/annotate_with_lookup_table.py
  merge_annotations: src/annotation/merge_coefs_with_annotations.R
  run_blast: src/annotation/blast_code/run_blast.sh
  run_blastp: src/annotation/blast_code/run_blastp.sh
  merge_blast_results: src/annotation/merge_coefs_with_blast.R
  plot_blast_results: src/annotation/blast_code/plot_blast_annotations_each_feature.R
  plot_blast_heatmaps: src/annotation/blast_code/plot_nonzero_features_heatmap.R
  plot_embeddings_umap: src/umap/plot_embeddings_umap.R
