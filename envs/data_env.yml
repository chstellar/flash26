name: snakemake-data-ingestion
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.10
  - sra-tools=3.0.0

  # Optional but commonly needed for ingestion workflows
  - pigz
  - parallel
  - curl
  - wget

  # Keep zlib constrained to avoid ABI mismatches
  - zlib<1.3 
  - libzlib<1.3
  - libcurl<8
