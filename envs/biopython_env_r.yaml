name: biopython_env_r
# This environment is used for tasks involving Biopython and related libraries.
channels:
    - conda-forge
    - defaults
    - bioconda
    - R
dependencies:
    # R dependencies
    - r-base==4.3.*
    - r-tidyverse
    - r-data.table
    - r-furrr
    - r-stringdist
    - r-optparse
    # Python dependencies for Biopython tasks
    - python>=3.9
    - biopython
    - dill
    - ipython
    - matplotlib
    - more-itertools
    - numpy=1.26.4
    - packaging
    - pandas=2.2.3
    - pillow
    - pipx
    - pyarrow
    - pyparsing
    - scikit-learn==1.5.2
    - scipy==1.13.1
    - six
    - threadpoolctl
    - bioconda::blast==2.16
    - networkx
    - fuzzysearch
